name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If you do NOT have a build process, use your project root as publish_dir
      - name: Remove workflow artifacts from output (optional, safer)
        run: |
          rm -rf .git .github

      # Deploy to GitHub Pages in a branch-specific subdirectory
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: preview/${{ env.BRANCH_NAME }}

      - name: Show preview URL
        run: echo "Preview: https://shek-hrd.github.io/chatter/preview/${{ env.BRANCH_NAME }}/"